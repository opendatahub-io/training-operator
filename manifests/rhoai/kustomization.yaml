# RHOAI configuration for Kubeflow Training Operator (KFTO)

# Adds namespace to all resources.
namespace: opendatahub

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: kubeflow-

configMapGenerator:
- name: rhoai-config
  envs:
    - params.env
- name: telemetry-config
  literals:
    - TELEMETRY_ENABLED=true
    - RECORDING_RULES_ENABLED=true
    - METRICS_PORT=8080

configurations:
  - params.yaml

replacements:
- source:
    kind: ConfigMap
    name: rhoai-config
    version: v1
    fieldPath: data.odh-training-operator-controller-image
  targets:
  - select:
      kind: Deployment
      name: training-operator
    fieldPaths:
    - spec.template.spec.containers.0.image
    - spec.template.spec.containers.0.args.2

# Labels to add to all resources and selectors.
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: training-operator

resources:
- ../base
- kubeflow-training-roles.yaml
- monitor.yaml
# Telemetry resources
- telemetry/

secretGenerator:
  - name: training-operator-webhook-cert
    options:
      disableNameSuffixHash: true

patches:
# Mount the controller config file for loading manager configurations
# through a ComponentConfig type
- path: manager_config_patch.yaml
- path: manager_metrics_patch.yaml
# Add telemetry components (kube-rbac-proxy and env vars)
- path: telemetry_patch.yaml
- patch: |-
    - op: remove
      path: /spec/ports/0
  target:
    group: ""
    version: v1
    kind: Service
    name: training-operator

# Add kube-rbac-proxy sidecar for secure metrics
- patch: |-
    - op: add
      path: /spec/template/spec/containers/-
      value:
        name: kube-rbac-proxy
        image: registry.redhat.io/openshift4/ose-kube-rbac-proxy:v4.14
        args:
          - --secure-listen-address=0.0.0.0:8443
          - --upstream=http://127.0.0.1:8080/metrics
          - --logtostderr=true
          - --v=2
        ports:
          - containerPort: 8443
            name: https-metrics
            protocol: TCP
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
  target:
    kind: Deployment
    name: training-operator

# Add telemetry environment variables
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: TELEMETRY_ENABLED
        value: "true"
  target:
    kind: Deployment
    name: training-operator

- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: RECORDING_RULES_ENABLED
        value: "true"
  target:
    kind: Deployment
    name: training-operator

# Update service to expose metrics port
- patch: |-
    - op: add
      path: /spec/ports/-
      value:
        name: https-metrics
        port: 8443
        targetPort: https-metrics
        protocol: TCP
  target:
    kind: Service
    name: training-operator