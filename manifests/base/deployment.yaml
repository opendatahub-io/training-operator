apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-operator
  namespace: kubeflow
  labels:
    app: training-operator
    control-plane: training-operator
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      app: training-operator
      control-plane: training-operator
  replicas: 1
  template:
    metadata:
      labels:
        app: training-operator
        control-plane: training-operator
        app.kubernetes.io/name: training-operator
        app.kubernetes.io/component: controller
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - command:
            - /manager
          image: ghcr.io/kubeflow/training-v1/training-operator
          name: training-operator
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          env:
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Telemetry control - set to "true" to enable metrics for Red Hat Observatorium
            # This is required for RHOAISTRAT-575 compliance
            - name: TELEMETRY_ENABLED
              value: "false"  # Default disabled, overridden to "true" in RHOAI overlay
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
      serviceAccountName: training-operator
      terminationGracePeriodSeconds: 10
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: training-operator-webhook-cert
